<!DOCTYPE html>
<html>
<head>
    <title>Panelists – Ethics of AI Society of Waterloo</title>

    <style>
        body {
            background-color: #232A44;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        a {
            color: #A9C7FF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .header-image {
            display: block;
            margin: 20px auto;
        }

        .content {
            width: 75%;
            margin: 40px auto;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
            margin-bottom: 50px;
        }

        .panelist-box {
            display: flex;
            background-color: #1b2138;
            padding: 25px;
            margin-bottom: 40px;
            border-left: 6px solid #d25e00;
            align-items: flex-start;
        }

        .panelist-image {
            width: 230px;
            margin-right: 25px;flex-shrink: 0;
        }

.panelist-image img {
    width: 100%;
    height: auto;
    display: block;
}

        .panelist-info h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .panelist-title {
            font-style: italic;
            margin-bottom: 12px;
        }

        .footer {
            text-align: center;
            margin-top: 80px;
            margin-bottom: 40px;
        }

        /* Responsive for smaller screens */
        @media (max-width: 768px) {
            .panelist-box {
                flex-direction: column;
            }

            .panelist-image {
                margin-bottom: 20px;
            }
        }

    </style>
</head>

<body>

<a href="index.html">
    <img src="images/eais.png" width="700" class="header-image">
</a>

<div class="newsletter-signup">
  <h2>Educators, researchers, students, and professionals are all welcome. Join our Microsoft Teams community to take part in meetings and discussions.</h2>

  <form
    action="mailto:info@ethicsofaiinstitute.com"
    method="post"
    enctype="text/plain"
  >
    <label for="newsletter-email">Email address</label>

    <div class="newsletter-fields">
      <input
        type="email"
        id="newsletter-email"
        name="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <button type="submit">Subscribe</button>
    </div>
  </form>
</div>

<style>
  .newsletter-signup {
    max-width: 600px;
    padding: 2rem;
    margin: 2rem auto;
    background: #f5f7f8;
    border-radius: 12px;
    font-family: Arial, sans-serif;
  }

  .newsletter-signup h2 {
    margin: 0 0 0.5rem;
    color: #17212b;
  }

  .newsletter-signup p {
    margin: 0 0 1.25rem;
    color: #4b5563;
  }

  .newsletter-signup label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 700;
  }

  .newsletter-fields {
    display: flex;
    gap: 0.75rem;
  }

  .newsletter-fields input {
    flex: 1;
    min-width: 0;
    padding: 0.75rem;
    border: 1px solid #9ca3af;
    border-radius: 6px;
    font: inherit;
  }

  .newsletter-fields input:focus {
    border-color: #176b5b;
    outline: 3px solid rgba(23, 107, 91, 0.2);
  }

  .newsletter-fields button {
    padding: 0.75rem 1.25rem;
    border: 0;
    border-radius: 6px;
    background: #176b5b;
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  .newsletter-fields button:hover {
    background: #105246;
  }

  @media (max-width: 520px) {
    .newsletter-fields {
      flex-direction: column;
    }
  }
</style>


<tr>

<td width="35%">&nbsp;</td>

<td width="65%">

<input type="submit" name="Submit" value="Submit">

<input type="reset" name="reset" value="Reset">

</td>

</tr>

<tr>

<td width="35%">&nbsp;</td>

<td width="65%">&nbsp;</td>

</tr>

</table>

</form>


<div class="footer">
    <a href="index.html">Return to Home</a>
</div>

</div>

</body>
</html>
